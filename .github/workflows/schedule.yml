name: Update Stream URL

on:
  schedule:
    # Run every 3 hours (Adjust based on token expiration)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows you to run it manually button

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: Allows the robot to write to your repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Update Script
        run: python update_stream.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "StreamBot"
          git config --global user.email "bot@noreply.github.com"
          git add stream.m3u8
          git commit -m "Auto-update stream URL" || echo "No changes to commit"
          git push
